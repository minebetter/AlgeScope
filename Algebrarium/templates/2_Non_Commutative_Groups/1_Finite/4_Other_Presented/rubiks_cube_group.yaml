# Meta-Template: 3x3 Rubik's Cube Move Sequence System
name: "3x3 Rubik's Cube Move Sequence System"
description: "A system where elements are sequences of cube rotations (e.g., R U R# U#). The system always simplifies sequences to a unique, canonical form."
demo_instances:
  - {}

set:
  definition: "A space-separated sequence of moves from the set {R, U, L, D, F, B} and their prime (#) and double (2) variants, simplified to its unique canonical form."
  validator: { type: "rubiks_move_validator" }
  sampler: { type: "rubiks_move_sampler" }

signature:
  - name: "Combine Sequences"
    symbol: "@" # A space as the operator symbol
    arity: 2
    precedence: 1
    logic: { type: "rubiks_move_compose_logic" }
  - name: "Inverse Sequence"
    symbol: "inv"
    arity: 1
    logic: { type: "rubiks_move_inverse_logic" }
  - name: "Identity (Solved State)"
    symbol: "e"
    arity: 0
    logic: { type: "constant_value", params: { value: "" } }

rules_template: >
  This system models the algebra of Rubik's Cube movements. To ensure that every distinct state of the cube is represented by one and only one sequence, all sequences are automatically simplified to a unique **canonical form**. The order of operations is critically important.

  ---
  **1. Core Operation: Sequence Composition**

  - `Seq1 Seq2` means performing the move sequence `Seq1` followed by `Seq2`. The combined string is then exhaustively simplified using the rules below to produce a single, unique result.

  ---
  **2. Simplification Rules for Canonical Form**

  These rules are applied repeatedly until the sequence can no longer be simplified.

  - **Rule A: Inverse Cancellation**
    - A move immediately followed by its inverse is removed. This is the most fundamental simplification.
    - Example: `'R U U# R#'` -> `R R#` -> `''` (Identity)

  - **Rule B: Same-Face Consolidation**
    - Consecutive turns of the same face are always combined into a single move based on modulo 4 arithmetic (where a 90° turn is 1 unit).
    - `'R R'` -> `'R2'` (1 + 1 = 2)
    - `'R R2'` -> `'R#'` (1 + 2 = 3, which is -1 mod 4)
    - `R R R R` -> `''` (1 + 1 + 1 + 1 = 4, which is 0 mod 4)

  - **Rule C: Canonical Ordering of Commuting Moves**
    - Physically, turning opposite faces results in the same state regardless of order (e.g., `'R L'` is the same as `'L R'`). To ensure a unique representation, the system enforces a standard order.
    - **The Rule**: If commuting moves are adjacent, they are systematically reordered. For instance, the system might enforce the order R before L, U before D, and F before B.
    - **Effect**: The sequence `'L R'` is not in canonical form and will be automatically rewritten as `'R L'`.
    - **Why this is important**: It guarantees that although `R U L` and `L R U` represent the same state, the system will always output only one of these (e.g., `R L U`, if the canonical order is alphabetical) as the unique result. This makes computation predictable and consistent.
    - **Example**: `'L# R U L'` can be simplified. First, `R` and `L` commute: `'L# (R L) U'` -> `'L# (L R) U'`. Now, `'L# L'` can cancel: `'' 'R U'` -> `'R U'`.

  ---
  **3. Solving Equations**

  - **Problem**: Find the sequence `x` that solves `'R U' x = 'R U R#'`.
  - **Principle**: `x = inv('R U') 'R U R#'`.
  - **Calculation**:
    1. The inverse of `'R U'` is `'U# R#'`.
    2. Combine: `"U' R'" "R U R'"`.
    3. Apply Rule A: The middle `R' R` cancels, leaving `"U' U R'"`.
    4. Apply Rule A again: The `U' U` cancels, leaving just `"R'"`.
  - **Answer**: The unique canonical form of the solution is `x = 'R#'`.
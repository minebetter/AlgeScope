# Meta-Template: Card Cutting System (Zₙ)
name: "Playing Card Cutting System (size {n})"
description: "A system where an element is a 'cut' operation on a deck of {n} cards."
demo_instances:
  - n: 52 # Standard deck
  - n: 32 # Pinochle deck

set:
  definition: "All 'cut_k' operations, representing moving the top k cards to the bottom, where k is from 0 to {n}-1."
  
  validator: 
    type: "finite_set_validator"
    params: 
      elements:
        generator: generate_shifts
        params:
          n: "{n}"
          prefix: "cut"

  sampler: 
    type: "finite_set_sampler"
    params: 
      elements:
        generator: generate_shifts
        params:
            n: "{n}"
            prefix: "cut"

signature:
  - name: "Combine Cuts"
    symbol: "->"
    arity: 2
    precedence: 1
    logic:
      type: "fsm_transition_compose_logic"
      params:
        num_states: "{n}"
        
  - name: "Inverse Cut"
    symbol: "inv"
    arity: 1
    logic:
      type: "fsm_transition_inverse_logic"
      params:
        num_states: "{n}"
       
  - name: "Identity (No Cut)"
    symbol: "e"
    arity: 0
    logic: { type: "constant_value", params: { value: "cut_0" } }

rules_template: >
  This system models the mathematical properties of performing simple cuts on a deck of cards.

  - **Core Operation (->)**: `cut_a -> cut_b` is equivalent to a single cut of `(a + b) mod {n}` cards.
    - **Example (n=52)**: `'cut_10' -> 'cut_5'` results in `'cut_15'`.
    - **Example (n=52)**: `'cut_40' -> 'cut_20'` results in `'cut_60 mod 52'`, which is `'cut_8'`.

  - **Inverse (inv)**: `inv(cut_k)` is the cut that restores the deck to its previous order.
    - **Example (n=52)**: `inv('cut_10')` is `'cut_42'`, because cutting 10 cards and then cutting another 42 is a total cut of 52, which is equivalent to no cut at all.

  - **How to solve for an unknown cut `cut_10 -> x = cut_3` (n=52)**:
    - **Principle**: `x = inv(cut_10) -> cut_3`.
    - **Solving**: `x = 'cut_42' -> 'cut_3'`, which results in `'cut_45'`.